
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Modern Neumorphic Login</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>

        :root {
            --bg-neu: #e0e5ec;
            --shadow-light: #ffffff;
            --shadow-dark: #a3b1c6;
            --text-main: #31344b;
            --text-muted: #6c7293;
            --accent: #6d5dfc;
            --accent-hover: #5b4bc4;
            --error: #e74c3c;
            --success: #2ecc71;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            min-height: 100vh;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background:
                linear-gradient(135deg, rgba(224, 229, 236, 0.85), rgba(224, 229, 236, 0.78)),
                url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=1920&q=80')
                no-repeat center center/cover;
        }

        .login-card {
            width: 100%;
            max-width: 410px;
            padding: 36px 32px;
            border-radius: 28px;
            background: rgba(224, 229, 236, 0.92);
            backdrop-filter: blur(8px);
            box-shadow:
                12px 12px 24px rgba(163, 177, 198, 0.75),
                -12px -12px 24px rgba(255, 255, 255, 0.9);
            transition: transform 0.3s ease;
        }

        .card-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .logo-badge {
            width: 60px;
            height: 60px;
            margin: 0 auto 14px;
            border-radius: 50%;
            background: var(--bg-neu);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            color: var(--accent);
            box-shadow:
                6px 6px 12px var(--shadow-dark),
                -6px -6px 12px var(--shadow-light);
        }

        .card-header h2 {
            color: var(--text-main);
            font-size: 24px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .card-header p {
            color: var(--text-muted);
            font-size: 13px;
            margin-top: 4px;
        }

        .input-group {
            margin-bottom: 20px;
            position: relative;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i.left-icon {
            position: absolute;
            left: 18px;
            color: var(--text-muted);
            font-size: 15px;
            transition: color 0.3s ease;
        }

        .input-wrapper input {
            width: 100%;
            padding: 14px 45px 14px 46px;
            border: none;
            outline: none;
            border-radius: 15px;
            background: var(--bg-neu);
            color: var(--text-main);
            font-size: 14px;
            font-weight: 500;
            box-shadow:
                inset 5px 5px 10px var(--shadow-dark),
                inset -5px -5px 10px var(--shadow-light);
            transition: all 0.3s ease;
        }

        .input-wrapper input::placeholder {
            color: #9ba3b8;
            font-weight: 400;
        }

        .input-wrapper input:focus {
            box-shadow:
                inset 3px 3px 6px var(--shadow-dark),
                inset -3px -3px 6px var(--shadow-light),
                0 0 0 2px rgba(109, 93, 252, 0.35);
        }

        .input-wrapper:focus-within i.left-icon {
            color: var(--accent);
        }

        .toggle-password {
            position: absolute;
            right: 16px;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 15px;
            transition: color 0.2s;
        }

        .toggle-password:hover {
            color: var(--accent);
        }

        .error-msg {
            color: var(--error);
            font-size: 11.5px;
            margin-top: 5px;
            padding-left: 6px;
            display: none;
        }

        .server-error {
            display: block;
            background: rgba(231, 76, 60, 0.08);
            border-left: 3px solid var(--error);
            border-radius: 8px;
            padding: 10px 12px;
            margin-bottom: 18px;
            color: var(--error);
            font-size: 12px;
        }

        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 22px;
            font-size: 12.5px;
            color: var(--text-muted);
            padding: 0 4px;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            user-select: none;
        }

        .remember-me input[type="checkbox"] {
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 6px;
            background: var(--bg-neu);
            box-shadow:
                inset 3px 3px 5px var(--shadow-dark),
                inset -3px -3px 5px var(--shadow-light);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .remember-me input[type="checkbox"]:checked {
            background: var(--accent);
            box-shadow: 2px 2px 5px rgba(109, 93, 252, 0.4);
        }

        .remember-me input[type="checkbox"]:checked::after {
            content: '✓';
            color: #fff;
            font-size: 11px;
            font-weight: 700;
        }

        .forgot-link {
            color: var(--accent);
            text-decoration: none;
            font-weight: 500;
        }

        .forgot-link:hover {
            text-decoration: underline;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 15px;
            background: var(--bg-neu);
            color: var(--accent);
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 0.5px;
            cursor: pointer;
            box-shadow:
                6px 6px 12px var(--shadow-dark),
                -6px -6px 12px var(--shadow-light);
            transition: all 0.25s ease;
        }

        .btn-submit:hover {
            color: #ffffff;
            background: var(--accent);
            box-shadow:
                6px 6px 14px rgba(109, 93, 252, 0.4),
                -4px -4px 10px var(--shadow-light);
            transform: translateY(-1px);
        }

        .btn-submit:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 22px 0 18px;
            color: var(--text-muted);
            font-size: 12px;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid rgba(163, 177, 198, 0.5);
        }

        .divider span {
            padding: 0 12px;
        }

        .social-icons {
            display: flex;
            justify-content: center;
            gap: 18px;
        }

        .social-btn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: none;
            background: var(--bg-neu);
            color: var(--text-main);
            font-size: 16px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow:
                5px 5px 10px var(--shadow-dark),
                -5px -5px 10px var(--shadow-light);
            transition: all 0.25s ease;
        }

        .social-btn:hover {
            color: var(--accent);
            box-shadow:
                inset 3px 3px 6px var(--shadow-dark),
                inset -3px -3px 6px var(--shadow-light);
        }

        .footer-text {
            text-align: center;
            margin-top: 22px;
            font-size: 13px;
            color: var(--text-muted);
        }

        .footer-text a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
        }

        .footer-text a:hover {
            text-decoration: underline;
        }

        .toast {
            position: fixed;
            top: 24px;
            right: 24px;
            background: var(--bg-neu);
            color: var(--text-main);
            padding: 14px 22px;
            border-radius: 14px;
            border-left: 4px solid var(--success);
            box-shadow:
                8px 8px 16px rgba(163, 177, 198, 0.8),
                -8px -8px 16px rgba(255, 255, 255, 0.9);
            font-size: 13.5px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 10px;
            transform: translateX(150%);
            transition: transform 0.4s ease;
            z-index: 1000;
        }

        .toast.show {
            transform: translateX(0);
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 28px 22px;
            }

            .toast {
                right: 12px;
                left: 12px;
                top: 12px;
            }
        }

    </style>
</head>

<body>

    <!-- Notification Toast -->

    <div class="toast" id="toast">
        <i class="fa-solid fa-circle-check" style="color: #2ecc71; font-size: 18px;"></i>
        <span id="toastMessage">Welcome Back!</span>
    </div>


    <!-- Main Login Card -->

    <div class="login-card">

        <div class="card-header">

            <div class="logo-badge">
                <i class="fa-solid fa-shield-halved"></i>
            </div>

            <h2>Welcome Back</h2>

            <p>Sign in with your username or email</p>

        </div>


        <!-- Login Form -->

        <form id="loginForm" method="POST" action="{% url 'login' %}" novalidate>

            {% csrf_token %}


            <!-- Django Backend Error -->

            {% if error %}

                <div class="server-error">
                    <i class="fa-solid fa-circle-exclamation"></i>
                    {{ error }}
                </div>

            {% endif %}


            <!-- Username or Email -->

            <div class="input-group">

                <div class="input-wrapper">

                    <input
                        type="text"
                        id="loginIdentifier"
                        name="username"
                        placeholder="Username or Email"
                        autocomplete="username"
                        required
                    >

                    <i class="fa-solid fa-user-check left-icon" id="identifierIcon"></i>

                </div>

                <div class="error-msg" id="identifierError">
                    Please enter a valid username or email.
                </div>

            </div>


            <!-- Password -->

            <div class="input-group">

                <div class="input-wrapper">

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Password"
                        autocomplete="current-password"
                        required
                    >

                    <i class="fa-solid fa-lock left-icon"></i>

                    <i class="fa-solid fa-eye toggle-password" id="togglePassword"></i>

                </div>

                <div class="error-msg" id="passwordError">
                    Password is required.
                </div>

            </div>


            <!-- Remember Me & Forgot Password -->

            <div class="form-options">

                <label class="remember-me">

                    <input type="checkbox" id="rememberMe">

                    <span>Remember me</span>

                </label>

                <a href="#" class="forgot-link">Forgot Password?</a>

            </div>


            <!-- Submit Button -->

            <button type="submit" class="btn-submit" id="submitBtn">
                Sign In
            </button>

        </form>


        <div class="divider">
            <span>OR CONTINUE WITH</span>
        </div>


        <!-- Social Icons -->

        <div class="social-icons">

            <button type="button" class="social-btn" title="Google">
                <i class="fa-brands fa-google"></i>
            </button>

            <button type="button" class="social-btn" title="GitHub">
                <i class="fa-brands fa-github"></i>
            </button>

            <button type="button" class="social-btn" title="Apple">
                <i class="fa-brands fa-apple"></i>
            </button>

        </div>


        <!-- Footer -->

        <div class="footer-text">
            Don't have an account?
            <a href="{% url 'register' %}">Sign Up</a>
        </div>

    </div>


    <script>

        const form = document.getElementById('loginForm');

        const identifierInput = document.getElementById('loginIdentifier');

        const identifierIcon = document.getElementById('identifierIcon');

        const passwordInput = document.getElementById('password');

        const togglePassword = document.getElementById('togglePassword');

        const submitBtn = document.getElementById('submitBtn');


        // Username or Email Icon Change

        identifierInput.addEventListener('input', () => {

            const value = identifierInput.value.trim();

            if (value.includes('@')) {

                identifierIcon.className = 'fa-solid fa-envelope left-icon';

            } else {

                identifierIcon.className = 'fa-solid fa-user left-icon';

            }

        });


        // Show / Hide Password

        togglePassword.addEventListener('click', () => {

            const isPassword = passwordInput.type === 'password';

            passwordInput.type = isPassword ? 'text' : 'password';

            togglePassword.classList.toggle('fa-eye');

            togglePassword.classList.toggle('fa-eye-slash');

        });


        // Form Validation

        form.addEventListener('submit', (e) => {

            e.preventDefault();

            let isValid = true;

            const identifier = identifierInput.value.trim();

            const password = passwordInput.value;

            const identifierError = document.getElementById('identifierError');

            const passwordError = document.getElementById('passwordError');


            // Validate Username or Email

            if (!identifier) {

                identifierError.textContent = 'Username or Email is required.';

                identifierError.style.display = 'block';

                isValid = false;

            } else {

                identifierError.style.display = 'none';

            }


            // Validate Password

            if (!password) {

                passwordError.textContent = 'Password is required.';

                passwordError.style.display = 'block';

                isValid = false;

            } else {

                passwordError.style.display = 'none';

            }


            // Submit to Django Backend

            if (isValid) {

                submitBtn.textContent = 'Signing in...';

                submitBtn.disabled = true;

                form.submit();

            }

        });

    </script>

</body>

</html>

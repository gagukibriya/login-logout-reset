
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Neumorphic Registration</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-neu: #e0e5ec;
            --shadow-light: #ffffff;
            --shadow-dark: #a3b1c6;
            --text-main: #31344b;
            --text-muted: #6c7293;
            --accent: #6d5dfc;
            --accent-hover: #5b4bc4;
            --error: #e74c3c;
            --success: #2ecc71;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            min-height: 100vh;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 0;

            background:
                linear-gradient(
                    135deg,
                    rgba(224, 229, 236, 0.85),
                    rgba(224, 229, 236, 0.78)
                ),
                url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=1920&q=80')
                no-repeat center center/cover;
        }

        .signup-card {
            width: 100%;
            max-width: 410px;
            padding: 36px 32px;
            border-radius: 28px;
            background: rgba(224, 229, 236, 0.92);
            backdrop-filter: blur(8px);
            box-shadow:
                12px 12px 24px rgba(163, 177, 198, 0.75),
                -12px -12px 24px rgba(255, 255, 255, 0.9);
            margin: 16px;
        }

        .card-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .logo-badge {
            width: 60px;
            height: 60px;
            margin: 0 auto 14px;
            border-radius: 50%;
            background: var(--bg-neu);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            color: var(--accent);
            box-shadow:
                6px 6px 12px var(--shadow-dark),
                -6px -6px 12px var(--shadow-light);
        }

        .card-header h2 {
            color: var(--text-main);
            font-size: 24px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .card-header p {
            color: var(--text-muted);
            font-size: 13px;
            margin-top: 4px;
        }

        .input-group {
            margin-bottom: 20px;
            position: relative;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i.left-icon {
            position: absolute;
            left: 18px;
            color: var(--text-muted);
            font-size: 15px;
            transition: color 0.3s ease;
        }

        .input-wrapper input {
            width: 100%;
            padding: 14px 45px 14px 46px;
            border: none;
            outline: none;
            border-radius: 15px;
            background: var(--bg-neu);
            color: var(--text-main);
            font-size: 14px;
            font-weight: 500;
            box-shadow:
                inset 5px 5px 10px var(--shadow-dark),
                inset -5px -5px 10px var(--shadow-light);
            transition: all 0.3s ease;
        }

        .input-wrapper input::placeholder {
            color: #9ba3b8;
            font-weight: 400;
        }

        .input-wrapper input:focus {
            box-shadow:
                inset 3px 3px 6px var(--shadow-dark),
                inset -3px -3px 6px var(--shadow-light),
                0 0 0 2px rgba(109, 93, 252, 0.35);
        }

        .input-wrapper:focus-within i.left-icon {
            color: var(--accent);
        }

        .toggle-password {
            position: absolute;
            right: 16px;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 15px;
            transition: color 0.2s;
        }

        .toggle-password:hover {
            color: var(--accent);
        }

        .strength-meter {
            height: 4px;
            width: 100%;
            background: #d1d9e6;
            border-radius: 4px;
            margin-top: 8px;
            overflow: hidden;
            display: none;
        }

        .strength-bar {
            height: 100%;
            width: 0%;
            transition: width 0.3s ease, background 0.3s ease;
        }

        .error-msg {
            color: var(--error);
            font-size: 11.5px;
            margin-top: 5px;
            padding-left: 6px;
            display: none;
        }

        .server-error {
            display: block;
            color: var(--error);
            background: rgba(231, 76, 60, 0.08);
            border-radius: 10px;
            padding: 10px 12px;
            margin-bottom: 18px;
            font-size: 12px;
            text-align: center;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            margin-top: 8px;
            border: none;
            border-radius: 15px;
            background: var(--bg-neu);
            color: var(--accent);
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 0.5px;
            cursor: pointer;
            box-shadow:
                6px 6px 12px var(--shadow-dark),
                -6px -6px 12px var(--shadow-light);
            transition: all 0.25s ease;
        }

        .btn-submit:hover {
            color: #ffffff;
            background: var(--accent);
            box-shadow:
                6px 6px 14px rgba(109, 93, 252, 0.4),
                -4px -4px 10px var(--shadow-light);
            transform: translateY(-1px);
        }

        .btn-submit:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 22px 0 18px;
            color: var(--text-muted);
            font-size: 12px;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid rgba(163, 177, 198, 0.5);
        }

        .divider span {
            padding: 0 12px;
        }

        .social-icons {
            display: flex;
            justify-content: center;
            gap: 18px;
        }

        .social-btn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: none;
            background: var(--bg-neu);
            color: var(--text-main);
            font-size: 16px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow:
                5px 5px 10px var(--shadow-dark),
                -5px -5px 10px var(--shadow-light);
            transition: all 0.25s ease;
        }

        .social-btn:hover {
            color: var(--accent);
            box-shadow:
                inset 3px 3px 6px var(--shadow-dark),
                inset -3px -3px 6px var(--shadow-light);
        }

        .footer-text {
            text-align: center;
            margin-top: 22px;
            font-size: 13px;
            color: var(--text-muted);
        }

        .footer-text a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
        }

        .footer-text a:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .signup-card {
                padding: 30px 22px;
            }
        }
    </style>
</head>

<body>

    <div class="signup-card">

        <div class="card-header">
            <div class="logo-badge">
                <i class="fa-solid fa-user-astronaut"></i>
            </div>

            <h2>Create Account</h2>
            <p>Join us today! Fill in your details below</p>
        </div>

        <form
            id="registerForm"
            method="POST"
            action="{% url 'register' %}"
            novalidate
        >

            {% csrf_token %}

            {% if error %}
                <div class="server-error">
                    <i class="fa-solid fa-circle-exclamation"></i>
                    {{ error }}
                </div>
            {% endif %}

            <!-- Username Field -->
            <div class="input-group">

                <div class="input-wrapper">
                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Username"
                        autocomplete="username"
                        required
                    >

                    <i class="fa-solid fa-user left-icon"></i>
                </div>

                <div class="error-msg" id="usernameError">
                    Username must be at least 3 characters.
                </div>

            </div>

            <!-- Email Field -->
            <div class="input-group">

                <div class="input-wrapper">
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Email Address"
                        autocomplete="email"
                        required
                    >

                    <i class="fa-solid fa-envelope left-icon"></i>
                </div>

                <div class="error-msg" id="emailError">
                    Please enter a valid email address.
                </div>

            </div>

            <!-- Password Field -->
            <div class="input-group">

                <div class="input-wrapper">
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Password"
                        autocomplete="new-password"
                        required
                    >

                    <i class="fa-solid fa-lock left-icon"></i>

                    <i
                        class="fa-solid fa-eye toggle-password"
                        id="togglePassword"
                    ></i>
                </div>

                <div class="strength-meter" id="strengthMeter">
                    <div class="strength-bar" id="strengthBar"></div>
                </div>

                <div class="error-msg" id="passwordError">
                    Password must be at least 6 characters.
                </div>

            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn-submit" id="submitBtn">
                Sign Up
            </button>

        </form>

        <div class="divider">
            <span>OR CONTINUE WITH</span>
        </div>

        <div class="social-icons">
            <button type="button" class="social-btn" title="Google">
                <i class="fa-brands fa-google"></i>
            </button>

            <button type="button" class="social-btn" title="GitHub">
                <i class="fa-brands fa-github"></i>
            </button>

            <button type="button" class="social-btn" title="Apple">
                <i class="fa-brands fa-apple"></i>
            </button>
        </div>

        <div class="footer-text">
            Already have an account?
            <a href="{% url 'login' %}">Sign In</a>
        </div>

    </div>

    <script>

        const form = document.getElementById('registerForm');

        const usernameInput = document.getElementById('username');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');

        const togglePassword = document.getElementById('togglePassword');

        const strengthMeter = document.getElementById('strengthMeter');
        const strengthBar = document.getElementById('strengthBar');

        const submitBtn = document.getElementById('submitBtn');


        // Show / Hide Password

        togglePassword.addEventListener('click', () => {

            const isPassword =
                passwordInput.getAttribute('type') === 'password';

            passwordInput.setAttribute(
                'type',
                isPassword ? 'text' : 'password'
            );

            togglePassword.classList.toggle('fa-eye');
            togglePassword.classList.toggle('fa-eye-slash');

        });


        // Password Strength Indicator

        passwordInput.addEventListener('input', () => {

            const val = passwordInput.value;

            if (val.length === 0) {
                strengthMeter.style.display = 'none';
                return;
            }

            strengthMeter.style.display = 'block';

            let strength = 0;

            if (val.length >= 6) strength += 33;

            if (/[A-Z]/.test(val) && /[0-9]/.test(val)) {
                strength += 33;
            }

            if (/[^A-Za-z0-9]/.test(val) && val.length >= 8) {
                strength += 34;
            }

            strengthBar.style.width = strength + '%';

            if (strength <= 33) {
                strengthBar.style.background = '#e74c3c';
            } else if (strength <= 66) {
                strengthBar.style.background = '#f39c12';
            } else {
                strengthBar.style.background = '#2ecc71';
            }

        });


        // Form Validation and Submission

        form.addEventListener('submit', (e) => {

            e.preventDefault();

            let isValid = true;

            // Username Validation

            if (usernameInput.value.trim().length < 3) {

                document.getElementById('usernameError').style.display = 'block';

                isValid = false;

            } else {

                document.getElementById('usernameError').style.display = 'none';

            }


            // Email Validation

            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            if (!emailRegex.test(emailInput.value.trim())) {

                document.getElementById('emailError').style.display = 'block';

                isValid = false;

            } else {

                document.getElementById('emailError').style.display = 'none';

            }


            // Password Validation

            if (passwordInput.value.length < 6) {

                document.getElementById('passwordError').style.display = 'block';

                isValid = false;

            } else {

                document.getElementById('passwordError').style.display = 'none';

            }


            // Submit to Django

            if (isValid) {

                submitBtn.disabled = true;

                submitBtn.textContent = 'Creating Account...';

                form.submit();

            }

        });

    </script>

</body>
</html>

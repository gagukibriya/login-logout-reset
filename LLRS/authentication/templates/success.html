<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome Home | Modern Neumorphic Dashboard</title>
    <!-- Google Fonts: Poppins for clean modern look -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-neu: #e0e5ec;
            --shadow-light: #ffffff;
            --shadow-dark: #a3b1c6;
            --text-main: #31344b;
            --text-muted: #6c7293;
            --accent: #6d5dfc;
            --accent-hover: #5b4bc4;
            --danger: #e74c3c;
            --success: #2ecc71;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            /* Matching Background Image & Soft Overlay from Registration Page */
            background: linear-gradient(135deg, rgba(224, 229, 236, 0.85), rgba(224, 229, 236, 0.78)),
                        url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=1920&q=80') no-repeat center center/cover;
        }

        /* Top Right Logout Button */
        .top-bar {
            position: fixed;
            top: 28px;
            right: 32px;
            z-index: 100;
        }

        .btn-logout {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 22px;
            border: none;
            border-radius: 15px;
            background: var(--bg-neu);
            color: var(--danger);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 6px 6px 12px rgba(163, 177, 198, 0.8), 
                       -6px -6px 12px rgba(255, 255, 255, 0.9);
            transition: all 0.25s ease;
        }

        .btn-logout:hover {
            background: var(--danger);
            color: #ffffff;
            box-shadow: 6px 6px 14px rgba(231, 76, 60, 0.35), 
                       -4px -4px 10px var(--shadow-light);
            transform: translateY(-2px);
        }

        .btn-logout:active {
            transform: translateY(1px);
            box-shadow: inset 4px 4px 8px rgba(0, 0, 0, 0.2);
        }

        /* Main Neumorphic Success / Home Card */
        .home-card {
            width: 100%;
            max-width: 480px;
            padding: 44px 36px;
            border-radius: 30px;
            background: rgba(224, 229, 236, 0.92);
            backdrop-filter: blur(8px);
            text-align: center;
            box-shadow: 12px 12px 24px rgba(163, 177, 198, 0.75), 
                       -12px -12px 24px rgba(255, 255, 255, 0.9);
            margin: 16px;
            animation: cardEntrance 0.6s cubic-bezier(0.22, 1, 0.36, 1);
        }

        @keyframes cardEntrance {
            from {
                opacity: 0;
                transform: translateY(24px) scale(0.97);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Success Checkmark Badge */
        .success-badge {
            width: 84px;
            height: 84px;
            margin: 0 auto 22px;
            border-radius: 50%;
            background: var(--bg-neu);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 36px;
            color: var(--success);
            box-shadow: inset 6px 6px 12px var(--shadow-dark), 
                        inset -6px -6px 12px var(--shadow-light);
            position: relative;
        }

        .success-badge i {
            animation: popCheck 0.5s ease 0.25s backwards;
        }

        @keyframes popCheck {
            0% { transform: scale(0); }
            75% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            border-radius: 20px;
            background: var(--bg-neu);
            color: var(--success);
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 14px;
            box-shadow: 4px 4px 8px var(--shadow-dark), 
                       -4px -4px 8px var(--shadow-light);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--success);
            box-shadow: 0 0 8px var(--success);
        }

        .home-card h1 {
            color: var(--text-main);
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .home-card h1 span {
            color: var(--accent);
        }

        .home-card p.subtitle {
            color: var(--text-muted);
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 28px;
        }

        /* Neumorphic Info Stats Box */
        .info-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            margin-bottom: 28px;
        }

        .info-box {
            padding: 16px 14px;
            border-radius: 18px;
            background: var(--bg-neu);
            box-shadow: inset 4px 4px 8px var(--shadow-dark), 
                        inset -4px -4px 8px var(--shadow-light);
            text-align: center;
        }

        .info-box span.label {
            display: block;
            font-size: 11.5px;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .info-box strong {
            font-size: 13.5px;
            color: var(--text-main);
            font-weight: 600;
        }

        /* Primary Action Button */
        .btn-primary {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 15px;
            background: var(--bg-neu);
            color: var(--accent);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            box-shadow: 6px 6px 12px var(--shadow-dark), 
                       -6px -6px 12px var(--shadow-light);
            transition: all 0.25s ease;
        }

        .btn-primary:hover {
            background: var(--accent);
            color: #ffffff;
            box-shadow: 6px 6px 14px rgba(109, 93, 252, 0.4), 
                       -4px -4px 10px var(--shadow-light);
            transform: translateY(-1px);
        }

        .btn-primary:active {
            transform: translateY(1px);
            box-shadow: inset 4px 4px 8px rgba(0, 0, 0, 0.2);
        }

        /* Logout Confirmation Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(49, 52, 75, 0.35);
            backdrop-filter: blur(4px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 999;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-box {
            width: 90%;
            max-width: 340px;
            padding: 28px 24px;
            border-radius: 24px;
            background: var(--bg-neu);
            text-align: center;
            box-shadow: 10px 10px 20px rgba(49, 52, 75, 0.25), 
                       -8px -8px 16px rgba(255, 255, 255, 0.8);
            animation: cardEntrance 0.3s ease;
        }

        .modal-box h3 {
            color: var(--text-main);
            font-size: 18px;
            margin-bottom: 8px;
        }

        .modal-box p {
            color: var(--text-muted);
            font-size: 13px;
            margin-bottom: 22px;
        }

        .modal-actions {
            display: flex;
            gap: 12px;
        }

        .modal-actions form {
            flex: 1;
            display: flex;
        }

        .modal-btn {
            flex: 1;
            width: 100%;
            padding: 11px;
            border: none;
            border-radius: 12px;
            font-size: 13.5px;
            font-weight: 600;
            cursor: pointer;
            background: var(--bg-neu);
            box-shadow: 4px 4px 8px var(--shadow-dark), 
                       -4px -4px 8px var(--shadow-light);
            transition: all 0.2s ease;
        }

        .modal-btn.cancel {
            color: var(--text-main);
        }

        .modal-btn.confirm {
            color: var(--danger);
        }

        .modal-btn.confirm:hover {
            background: var(--danger);
            color: #fff;
        }

        .modal-btn.cancel:hover {
            box-shadow: inset 3px 3px 6px var(--shadow-dark), 
                        inset -3px -3px 6px var(--shadow-light);
        }
    </style>
</head>
<body>

    <!-- Top Right Logout Button -->
    <div class="top-bar">
        <button type="button" class="btn-logout" id="logoutTrigger">
            <i class="fa-solid fa-right-from-bracket"></i>
            <span>Logout</span>
        </button>
    </div>

    <!-- Main Success / Homepage Card -->
    <div class="home-card">
        <div class="success-badge">
            <i class="fa-solid fa-check"></i>
        </div>

        <div class="status-pill">
            <span class="status-dot"></span>
            Authenticated Session
        </div>

        <h1>Login <span>Successful!</span></h1>
        <p class="subtitle">
            Welcome back to your workspace. Your account is verified and ready to go.
        </p>

        <!-- Session Info Grid -->
        <div class="info-grid">
            <div class="info-box">
                <span class="label">Account Status</span>
                <strong style="color: #2ecc71;">Active & Verified</strong>
            </div>
            <div class="info-box">
                <span class="label">Login Time</span>
                <strong id="loginTime">Just now</strong>
            </div>
        </div>

        <button type="button" class="btn-primary" id="exploreBtn">
            <span>Go to Dashboard</span>
            <i class="fa-solid fa-arrow-right"></i>
        </button>
    </div>

    <!-- Neumorphic Logout Confirmation Modal -->
    <div class="modal-overlay" id="logoutModal">
        <div class="modal-box">
            <h3>Confirm Logout</h3>
            <p>Are you sure you want to end your current session?</p>
            <div class="modal-actions">
                <button type="button" class="modal-btn cancel" id="cancelLogout">Cancel</button>
                <form method="POST" action="{% url 'logout' %}">
                    {% csrf_token %}
                    <button type="submit" class="modal-btn confirm">Yes, Logout</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        // Set live formatted login time
        const loginTimeEl = document.getElementById('loginTime');
        const now = new Date();
        loginTimeEl.textContent = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

        // Logout Modal Controls
        const logoutTrigger = document.getElementById('logoutTrigger');
        const logoutModal = document.getElementById('logoutModal');
        const cancelLogout = document.getElementById('cancelLogout');
        const exploreBtn = document.getElementById('exploreBtn');

        logoutTrigger.addEventListener('click', () => {
            logoutModal.classList.add('active');
        });

        cancelLogout.addEventListener('click', () => {
            logoutModal.classList.remove('active');
        });

        // Close modal when clicking outside the box
        logoutModal.addEventListener('click', (e) => {
            if (e.target === logoutModal) {
                logoutModal.classList.remove('active');
            }
        });

        exploreBtn.addEventListener('click', () => {
            exploreBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> <span>Loading Workspace...</span>';
            setTimeout(() => {
                exploreBtn.innerHTML = '<span>Go to Dashboard</span> <i class="fa-solid fa-arrow-right"></i>';
            }, 1200);
        });
    </script>
</body>
</html>
